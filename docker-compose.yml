services:
  showdown:
    build:
      context: .
      args:
        # Point at your fork, or leave as upstream. Any git ref works (branch, tag, commit).
        PS_REPO: https://github.com/smogon/pokemon-showdown.git
        PS_REF: master
        NODE_VERSION: "22"
    image: pokemon-showdown:local
    # Rebuild on every (re)deploy — required for Portainer to pick up Dockerfile/upstream changes.
    pull_policy: build
    container_name: pokemon-showdown
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Registered Pokémon Showdown username(s) to grant admin (~). Comma-separated for several.
      PS_ADMIN: ""
    volumes:
      # Named volume (not a bind mount) so it works from Portainer and gets correct ownership.
      - showdown_data:/data
    # Pi-friendly memory ceiling; the server + subprocesses sit well under this for a friend group.
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  showdown_data:
